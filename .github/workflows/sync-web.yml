name: Actualizar web desde la planilla

# Se ejecuta a mano: GitHub → Actions → "Actualizar web desde la planilla" → Run workflow.
# Lee las pestañas "Web Line-up" y "Web Puestos" de la planilla, valida los datos y, si hay
# cambios, los guarda en el repositorio y publica el sitio.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-web
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Leer la planilla y preparar los datos
        run: npm run sync

      - name: Guardar cambios
        id: commit
        run: |
          git add src/data/generated public/artists
          if git diff --cached --quiet; then
            echo "La web ya estaba al día: no hay cambios que publicar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualiza line-up y puestos desde la planilla"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho por esta acción no dispara deploy.yml por sí solo, así que se lanza aquí.
      - name: Publicar el sitio
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
